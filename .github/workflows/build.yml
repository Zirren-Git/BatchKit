name: build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1 || true)"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          echo "sdkmanager=${SDKMANAGER:-not found}"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platform-tools" "platforms;android-37" "build-tools;36.0.0" || true
          fi

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      # Every Gradle invocation appends to build-output.log so that the log can be
      # published as an artifact and as the ci-logs branch (see below).
      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee build-output.log

      - name: Assemble debug APK
        if: always()
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a build-output.log

      - name: Assemble release APK
        if: always()
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee -a build-output.log

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk dist/ 2>/dev/null || true
          ls -l dist || true

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batchkit-apks
          path: dist/*.apk
          if-no-files-found: warn

      - name: Upload build log and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build-output.log
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore

      # Compile errors are surfaced as check annotations so they can be read
      # through the GitHub API without downloading any artifact.
      - name: Surface Gradle errors
        if: always()
        continue-on-error: true
        run: |
          if [ -f build-output.log ]; then
            grep -E "(^e: |error: |FAILURE: Build failed|What went wrong|Caused by: )" build-output.log               | head -n 40               | while IFS= read -r line; do
                  echo "::error::${line//\r/}"
                done
          fi

      # The build log is also mirrored to a branch so that it can be fetched with
      # plain git from anywhere, including restricted environments.
      - name: Publish build log to ci-logs branch
        if: always()
        continue-on-error: true
        run: |
          git config user.email "ci@batchkit.local"
          git config user.name "BatchKit CI"
          git checkout --orphan ci-logs
          git rm -rf --cached . > /dev/null 2>&1 || true
          mkdir -p ci-logs
          cp build-output.log ci-logs/last-build.log 2>/dev/null || true
          printf 'run: %s\nconclusion: see job summary\n' "${GITHUB_RUN_ID}" > ci-logs/last-run.txt
          git add -f ci-logs
          git commit -m "ci: build log for run ${GITHUB_RUN_ID}" || true
          git push --force origin ci-logs

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: batchkit-apks
          path: dist

      - name: Rename assets
        run: |
          cd dist
          for apk in *.apk; do
            case "$apk" in
              app-debug.apk) mv "$apk" "batchkit-${GITHUB_REF_NAME}-debug.apk" ;;
              app-release.apk) mv "$apk" "batchkit-${GITHUB_REF_NAME}-release.apk" ;;
            esac
          done
          ls -l

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "BatchKit ${GITHUB_REF_NAME}" \
            --notes-file docs/RELEASE_NOTES.md \
            dist/*.apk
