name: build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1 || true)"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          echo "sdkmanager=${SDKMANAGER:-not found}"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platform-tools" "platforms;android-37" "build-tools;36.0.0" || true
          fi

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      # Every Gradle invocation appends to build-output.log so that the full log is
      # published as an artifact even when a task fails.
      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee build-output.log

      - name: Assemble debug APK
        if: always()
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a build-output.log

      - name: Assemble release APK
        if: always()
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee -a build-output.log

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk dist/ 2>/dev/null || true
          ls -l dist || true

      - name: Verify APKs
        if: always()
        continue-on-error: true
        run: bash scripts/verify_apks.sh dist/*.apk

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batchkit-apks
          path: dist/*.apk
          if-no-files-found: warn

      - name: Upload build log and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build-output.log
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore

      # Failing unit tests are surfaced as check annotations too, so the reason is
      # visible without downloading the test report.
      - name: Surface unit test failures
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PYEOF' || true
          import glob
          import xml.etree.ElementTree as ET

          for path in sorted(glob.glob("app/build/test-results/**/*.xml", recursive=True)):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter("testcase"):
                  for failure in list(case.iter("failure")) + list(case.iter("error")):
                      head = (failure.get("message") or failure.text or "").strip().splitlines()
                      detail = head[0][:300] if head else "no message"
                      print(f"::error::{case.get('classname')}.{case.get('name')}: {detail}")
          PYEOF

      # Compile errors are surfaced as check annotations so they can be read
      # through the GitHub API without downloading any artifact.
      - name: Surface Gradle errors
        if: always()
        continue-on-error: true
        run: |
          if [ -f build-output.log ]; then
            grep -E "(^e: |error: |FAILURE: Build failed|What went wrong|Caused by: )" build-output.log               | head -n 40               | while IFS= read -r line; do
                  echo "::error::${line//\r/}"
                done
          fi

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: batchkit-apks
          path: dist

      - name: Rename assets
        run: |
          cd dist
          for apk in *.apk; do
            case "$apk" in
              app-debug.apk) mv "$apk" "batchkit-${GITHUB_REF_NAME}-debug.apk" ;;
              app-release.apk) mv "$apk" "batchkit-${GITHUB_REF_NAME}-release.apk" ;;
            esac
          done
          ls -l

      - name: Verify APKs
        run: bash scripts/verify_apks.sh dist/*.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="BatchKit ${GITHUB_REF_NAME}"
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.apk --clobber
            gh release edit "${GITHUB_REF_NAME}" --title "$title" --notes-file docs/RELEASE_NOTES.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "$title" \
              --notes-file docs/RELEASE_NOTES.md \
              dist/*.apk
          fi

  # A CI build proves the APK compiles; this job proves it opens. It boots a real
  # system image, installs both APKs, launches them and reports the outcome (and
  # any crash trace) as annotations.
  emulator-smoke:
    name: Launch on a device image
    needs: build
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: batchkit-apks
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on Android 17
        id: newest
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/emulator_launch_check.sh dist

      - name: Launch on Android 16
        if: steps.newest.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/emulator_launch_check.sh dist
